<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F59B" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040B08" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="12" y1="12" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="irisCore" x1="35" y1="35" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#00F59B"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="#040B08"/>
  <rect x="3" y="3" width="114" height="114" rx="25" fill="url(#bgGlow)" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-opacity="0.65"/>
  <!-- Outer hexagonal neural ring -->
  <polygon points="60,14 99,36 99,84 60,106 21,84 21,36" stroke="url(#emeraldGrad)" stroke-width="3" fill="none" stroke-linejoin="round" opacity="0.85"/>
  <!-- Orbital meridians -->
  <ellipse cx="60" cy="60" rx="34" ry="16" transform="rotate(-28 60 60)" stroke="#00F59B" stroke-width="2.2" fill="none" opacity="0.85"/>
  <ellipse cx="60" cy="60" rx="34" ry="16" transform="rotate(28 60 60)" stroke="#A3E635" stroke-width="2.2" fill="none" opacity="0.75"/>
  <!-- Central OmniSense Iris -->
  <circle cx="60" cy="60" r="15" fill="#040B08" stroke="url(#emeraldGrad)" stroke-width="3.5"/>
  <circle cx="60" cy="60" r="7.5" fill="url(#irisCore)"/>
  <circle cx="57" cy="57" r="2.5" fill="#ECFDF5"/>
  <!-- Orbiting language/vision nodes -->
  <circle cx="60" cy="14" r="4" fill="#00F59B"/>
  <circle cx="99" cy="36" r="3.5" fill="#A3E635"/>
  <circle cx="99" cy="84" r="3.5" fill="#00F59B"/>
  <circle cx="60" cy="106" r="4" fill="#A3E635"/>
  <circle cx="21" cy="84" r="3.5" fill="#00F59B"/>
  <circle cx="21" cy="36" r="3.5" fill="#A3E635"/>
</svg>
